# ===== Fonte =====
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
adjust_line_height 1

# ===== Tema / Cores (Solarized Dark) =====
background            #031219
foreground            #839496
selection_background  #073642
selection_foreground  #93a1a1
cursor                #839496
cursor_text_color     #002b36

# Solarized Dark palette
color0  #073642
color1  #dc322f
color2  #859900
color3  #b58900
color4  #268bd2
color5  #d33682
color6  #2aa198
color7  #eee8d5
color8  #002b36
color9  #cb4b16
color10 #586e75
color11 #657b83
color12 #839496
color13 #6c71c4
color14 #93a1a1
color15 #fdf6e3

# ===== Transparencia e Blur =====
background_opacity 0.9
background_blur    20

# ===== Cursor =====
cursor_shape block
cursor_blink_interval 0.5

# ===== Shell =====
shell /opt/homebrew/bin/fish

# ===== Janela =====
window_padding_width 4
hide_window_decorations titlebar-only
confirm_os_window_close -1
macos_option_as_alt left
macos_quit_when_last_window_closed yes

# ===== Tabs =====
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #fdf6e3
active_tab_background   #268bd2
inactive_tab_foreground #839496
inactive_tab_background #073642
tab_title_template        "{fmt.fg.tab}{bell_symbol}{activity_symbol}{' ' + title}"
tab_title_max_length      30

# ===== Remote Control (para floating windows) =====
allow_remote_control yes
listen_on unix:/tmp/kitty-main

# ===== Quick Access Terminal (floating windows como no linkarzu) =====
# Terminal flutuante central
map ctrl+shift+t launch --type=background kitten quick-access-terminal --config ~/.config/kitty/quick-access-terminal-center.conf
# Terminal flutuante maior
map ctrl+shift+n launch --type=background kitten quick-access-terminal --config ~/.config/kitty/quick-access-terminal-daily.conf
# Bookmarks picker - popup central com fzf (igual no video do linkarzu)
map ctrl+shift+b launch --type=background kitten quick-access-terminal --config ~/.config/kitty/quick-access-terminal-center.conf --instance-group bookmarks /bin/bash -c '$HOME/.config/kitty/scripts/bookmarks-picker.sh'
# Project switcher - zoxide + fzf popup (abre nova tab no diretório)
map ctrl+shift+z launch --type=background kitten quick-access-terminal --config ~/.config/kitty/quick-access-terminal-zoxide.conf --instance-group zoxide /bin/bash -c '$HOME/.config/kitty/scripts/zoxide-picker.sh'

# ===== Atalhos =====
# Nova janela flutuante (OS-level)
map cmd+shift+enter launch --type=os-window --cwd=current
# Nova tab
map cmd+t new_tab_with_cwd
# Navegar tabs
map cmd+shift+right next_tab
map cmd+shift+left  previous_tab
# Splits
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
# Navegar splits
map cmd+left  neighboring_window left
map cmd+right neighboring_window right
map cmd+up    neighboring_window up
map cmd+down  neighboring_window down
# Resize splits
map cmd+shift+up    resize_window taller
map cmd+shift+down  resize_window shorter
map cmd+shift+right resize_window wider
map cmd+shift+left  resize_window narrower
# Font size
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0
# Reload config
map ctrl+cmd+, load_config_file

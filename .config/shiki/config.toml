[general]
default_notebook = "personal"
editor = "nvim"
daily_template = "daily"
use_favorite_editor = false
mouse_drag_selection = true
show_hints = true

[keybindings]
leader = "space"
quit = "q"

[keybindings.global]
theme_picker = "c"
global_search = "g"
tags_panel = "T"
logs = "l"
toggle_favorite_editor = "e"
check_update = "U"
drawer = "b"
undo_delete = "u"
settings = "s"

[keybindings.notebooks]
new = "a"
rename = "r"
delete = "d"
sync = "s"
pull = "p"
pull_all = "P"
set_remote = "R"
push = "u"

[keybindings.notes]
new = "a"
rename = "r"
delete = "d"
edit_inline = "i"
edit_external = "E"
search = "/"
daily_note = "t"
move_to_notebook = "m"
sort = "o"
tree_view = "T"
toggle_dates = "D"
new_folder = "f"
visual = "v"
copy_entries = "y"

[keybindings.preview]
edit_inline = "i"
edit_external = "E"
history = "H"
links = "L"

[theme]
name = "onedark-darker"
bg = "#1f2329"
fg = "#a0a8b7"
accent = "#4fa6ed"
selection = "#282c34"
border = "#535965"
statusbar = "#282c34"
highlight = "#e2b86b"
error = "#e55561"
warning = "#cc9057"
success = "#8ebd6b"
inactive = "#535965"
scrollbar = "#282c34"
tab_active = "#bf68d9"
tab_inactive = "#535965"
panel_title = "#48b0bd"
cursor = "#a0a8b7"
link = "#4fa6ed"
tag = "#bf68d9"
muted = "#7a818e"

[git]
auto_commit = true
auto_push = false
commit_prefix = "shiki: "
remote = "origin"
branch = "main"
sign_commits = false
auto_sync = false
auto_sync_every = 5
remote_template = ""

[editor]
mouse_selection = true
find_replace = true
os_clipboard = false
select_all_ctrl_a = false
line_numbers = false
multi_cursor = false


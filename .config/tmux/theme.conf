#### COLOUR (Catppuccin Macchiato)

# default statusbar colors
set-option -g status-style bg=#1e2030,fg=#8087a2,default

# default window title colors
set-window-option -g window-status-style fg=#8087a2,bg=#1e2030,dim

# active window title colors
set-window-option -g window-status-current-style fg=#eed49f,bg=default,bright

# pane border
set-option -g pane-border-style fg=#363a4f
set-option -g pane-active-border-style fg=#cad3f4,bg=#363a4f

# message text
set-option -g message-style bg=#363a4f,fg=#cad3f4

# pane number display
set-option -g display-panes-active-colour "#8aadf4"
set-option -g display-panes-colour "#eed49f"

# clock
set-window-option -g clock-mode-colour "#8bd5ca"

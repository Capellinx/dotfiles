# vim: ft=tmux
set -g mode-style "fg=#cad3f4,bg=#363a4f"

set -g message-style "fg=#cad3f4,bg=#363a4f"
set -g message-command-style "fg=#cad3f4,bg=#363a4f"

set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#cad3f4"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#5b6078,bg=#1e2030"
set -g status-bg "#1e2030"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# Left: session > user > window index
set -g status-left "#[fg=#1e2030,bg=#eed49f,bold] #S #[fg=#eed49f,bg=#8087a2]#[fg=#1e2030,bg=#8087a2,bold] #(whoami) #[fg=#8087a2,bg=#5b6078]#[fg=#cad3f4,bg=#5b6078] #I #[fg=#5b6078,bg=#1e2030] "

# Right: hostname
set -g status-right "#[fg=#5b6078,bg=#1e2030]#[fg=#cad3f4,bg=#5b6078] #h "

setw -g window-status-activity-style "underscore,fg=#8087a2,bg=#1e2030"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#8087a2,bg=#1e2030"

# Inactive window
setw -g window-status-format "  #[fg=#8087a2]#I #W  "

# Active window with arrows
setw -g window-status-current-format "#[fg=#1e2030,bg=#eed49f]#[fg=#1e2030,bg=#eed49f,bold] #I #W #[fg=#eed49f,bg=#1e2030]"
